name: API sync (every 15 min, tiered)
on:
  push:
    paths: ['.github/sync-trigger']
  schedule:
    # Every 15 min: orders + inventory. Hourly: Amazon finances, inbound. Every 6 h: traffic, BSR/Buy Box, ads reports.
    # Daily: full re-pull. Tier state lives in data/sync-state.json. Data file is committed only when its content changes.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: 'Only test API logins (no data written)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency: { group: data-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch from Amazon / Wayfair APIs
        env:
          LG_DK: ${{ secrets.LG_DK }}
          AMZ_SP_CLIENT_ID: ${{ secrets.AMZ_SP_CLIENT_ID }}
          AMZ_SP_CLIENT_SECRET: ${{ secrets.AMZ_SP_CLIENT_SECRET }}
          AMZ_SP_REFRESH_TOKEN: ${{ secrets.AMZ_SP_REFRESH_TOKEN }}
          AMZ_ADS_CLIENT_ID: ${{ secrets.AMZ_ADS_CLIENT_ID }}
          AMZ_ADS_CLIENT_SECRET: ${{ secrets.AMZ_ADS_CLIENT_SECRET }}
          AMZ_ADS_REFRESH_TOKEN: ${{ secrets.AMZ_ADS_REFRESH_TOKEN }}
          WF_CLIENT_ID: ${{ secrets.WF_CLIENT_ID }}
          WF_CLIENT_SECRET: ${{ secrets.WF_CLIENT_SECRET }}
        run: node scripts/api-sync.mjs ${{ inputs.probe && '--probe' || '' }}
      - name: Commit data
        if: ${{ !inputs.probe }}
        run: |
          git add -N data/sync-state.json 2>/dev/null || true
          if git diff --quiet data/; then echo "no changes"; exit 0; fi
          git config user.name "lignarc-sync"
          git config user.email "lignarc-sync@users.noreply.github.com"
          git add data/lignarc.enc.json data/sync-state.json
          if git diff --cached --quiet -- data/lignarc.enc.json; then MSG="sync state"; else MSG="data: API sync"; fi
          git commit -m "$MSG $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M') GMT+7"
          git pull --rebase -q && git push
      - name: Re-run while Amazon Ads reports are queued
        # GitHub's 15-minute schedule often fires only every few hours; Amazon reports take 15-60 min.
        if: ${{ !inputs.probe }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(node -e "const s=require('./data/sync-state.json');process.stdout.write(String((s.adsQ||[]).length))")
          if [ "$N" != "0" ]; then echo "$N Amazon Ads reports still queued - re-running in 8 min"; sleep 480; gh workflow run api-sync.yml --ref main; fi
