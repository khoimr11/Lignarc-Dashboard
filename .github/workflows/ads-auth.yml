name: Amazon Ads authorization
on:
  push:
    paths: ['data/ads-code.enc.json']
permissions:
  contents: write
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Exchange code
        env:
          LG_DK: ${{ secrets.LG_DK }}
          AMZ_ADS_CLIENT_ID: ${{ secrets.AMZ_ADS_CLIENT_ID }}
          AMZ_ADS_CLIENT_SECRET: ${{ secrets.AMZ_ADS_CLIENT_SECRET }}
          AMZ_SP_CLIENT_ID: ${{ secrets.AMZ_SP_CLIENT_ID }}
          AMZ_SP_CLIENT_SECRET: ${{ secrets.AMZ_SP_CLIENT_SECRET }}
        run: node scripts/ads-auth.mjs > ads-auth.txt 2>&1; cat ads-auth.txt | sed -E 's/[A-Za-z0-9|_-]{40,}/[x]/g'
      - name: Commit
        run: |
          git config user.name "lignarc-sync"; git config user.email "lignarc-sync@users.noreply.github.com"
          git add -A data/; git commit -m "Amazon Ads: store authorization (encrypted)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
