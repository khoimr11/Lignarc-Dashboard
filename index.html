<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#efebe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lignarc · Commerce Dashboard</title>
<link rel="icon" href="assets/mark-walnut.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/styles.css?v=1">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<!-- Login -->
<section id="login" class="login" hidden>
  <form class="glass login-card" id="loginForm" autocomplete="on">
    <img class="logo only-light" src="assets/logo-walnut.png" alt="Lignarc">
    <img class="logo only-dark" src="assets/logo-white.png" alt="Lignarc">
    <p class="login-sub">Commerce Dashboard · Wayfair CastleGate &amp; Amazon</p>
    <label class="field"><span>Tài khoản</span><input id="user" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
    <label class="field"><span>Mật khẩu</span><input id="pass" name="password" type="password" autocomplete="current-password" required></label>
    <label class="remember"><input type="checkbox" id="remember" checked> Ghi nhớ trên thiết bị này</label>
    <button class="btn-primary" id="loginBtn" type="submit">Đăng nhập</button>
    <p class="login-err" id="loginErr" role="alert"></p>
    <p class="login-foot">Dữ liệu được mã hóa AES-256. Chỉ giải mã trên trình duyệt sau khi đăng nhập.</p>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
  <div class="topwrap">
  <header class="topbar glass">
    <div class="brand">
      <img class="only-light" src="assets/logo-walnut.png" alt="Lignarc">
      <img class="only-dark" src="assets/logo-white.png" alt="Lignarc">
    </div>
    <div class="top-actions">
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="themeBtn" title="Giao diện sáng/tối" aria-label="Giao diện sáng/tối"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button class="icon-btn" id="logoutBtn" title="Đăng xuất" aria-label="Đăng xuất"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
    </div>
  </header>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Màn hình">
      <button role="tab" data-tab="overview" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Tổng quan</span></button>
      <button role="tab" data-tab="castlegate"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 4l9 5.5V20H3zM7 20v-7h10v7M7 16h10"/></svg><span>CastleGate</span></button>
      <button role="tab" data-tab="sales"><svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg><span>Bán hàng</span></button>
      <button role="tab" data-tab="ads"><svg viewBox="0 0 24 24"><path d="M4 14V10l11-5v14L4 14zm11-1h2a3 3 0 0 0 0-6h-2M7 15l1.5 5h2.5L9.5 15"/></svg><span>Quảng cáo</span></button>
      <button role="tab" data-tab="amazon"><svg viewBox="0 0 24 24"><path d="M4 15c4.5 3 11.5 3 16 0M17 14l3 1-1 3M7 11V6.5a2.5 2.5 0 0 1 5 0V11m-6 0h8"/></svg><span>Amazon</span></button>
    </nav>
  </div>

  <div class="filters" id="filters">
    <div class="seg glass" id="period" role="radiogroup" aria-label="Khoảng thời gian">
      <button data-p="7">7 ngày</button><button data-p="30" aria-pressed="true">30 ngày</button><button data-p="mtd">Tháng này</button><button data-p="qtd">Quý này</button><button data-p="all">Toàn bộ</button>
    </div>
    <div class="seg glass" id="channel" role="radiogroup" aria-label="Kênh">
      <button data-c="all" aria-pressed="true">Tất cả kênh</button><button data-c="wf">Wayfair</button><button data-c="amz">Amazon</button>
    </div>
    <label class="tt-toggle glass"><input type="checkbox" id="incTT"> <span>Gồm đơn Tried &amp; True</span></label>
  </div>

  <main id="view" class="view"></main>
  <footer class="foot">Nguồn: Wayfair Partner Home (CastleGate Orders, Inventory, Inbound, Advertising) · Amazon Seller Central &amp; Amazon Ads · KPI: Cashflow 26+27 · Giá vốn: PO 1st Shipment</footer>
</div>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="assets/app.js?v=1"></script>
</body>
</html>
